<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Penilai — PAMERIN</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-root="../">
<div id="header"></div>
<main class="main">
<div class="container">
  <div class="flex-between">
    <div><h1 style="margin:0">Dashboard Penilai</h1><p class="text-muted" id="hello"></p></div>
  </div>
  <div class="stats-grid mt-2" id="stats"></div>
  <h2 class="mt-3">Daftar Poster</h2>
  <div id="list" class="mt-2"><div class="empty">Memuat...</div></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/nav.js"></script>
<script>
(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  document.getElementById('hello').textContent = `Selamat bertugas, ${auth.profile.full_name}.`;

  const { data: posters } = await sb.from('posters')
    .select('id,kode,judul,image_url,participants(nama,kelas)')
    .eq('status','published').order('kode');
  const { data: my } = await sb.from('assessments').select('poster_id,nilai').eq('judge_id', auth.session.user.id);
  const scored = new Set((my||[]).map(a => a.poster_id));

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${posters?.length||0}</div><div class="lbl">Total poster</div></div>
    <div class="stat-card"><div class="num">${scored.size}</div><div class="lbl">Sudah dinilai</div></div>
    <div class="stat-card"><div class="num">${(posters?.length||0) - scored.size}</div><div class="lbl">Belum dinilai</div></div>
    <div class="stat-card"><div class="num">${my?.length ? (my.reduce((s,a)=>s+Number(a.nilai),0)/my.length).toFixed(1) : '—'}</div><div class="lbl">Rata-rata nilai Anda</div></div>`;

  const list = document.getElementById('list');
  if (!posters?.length) { list.innerHTML = '<div class="empty">Belum ada poster.</div>'; return; }
  list.innerHTML = '<div class="poster-grid">' + posters.map(p => {
    const done = scored.has(p.id);
    return `<a href="assessment.html?kode=${encodeURIComponent(p.kode)}" class="poster-card">
      <span class="kode-badge">${esc(p.kode)}</span>
      <img src="${esc(p.image_url||'')}" loading="lazy" onerror="this.style.opacity=.3">
      <div class="meta">
        <h4>${esc(p.judul)}</h4>
        <small>${esc(p.participants?.nama||'—')} · ${esc(p.participants?.kelas||'')}</small>
        <div style="margin-top:8px"><span class="badge ${done?'badge-accent':''}">${done?'✓ Sudah dinilai':'Belum dinilai'}</span></div>
      </div>
    </a>`;
  }).join('') + '</div>';
})();
</script>
</body>
</html>
