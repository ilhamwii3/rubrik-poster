<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beri Nilai — PAMERIN</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .role-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .role-tabs button { flex: 1; padding: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); font-weight: bold; cursor: pointer; transition: 0.2s; }
  .role-tabs button.on { border-color: var(--primary); background: var(--primary); color: white; }
</style>
</head>
<body data-root="">
<div id="header"></div>
<main class="main">
<div class="container-narrow" id="content"><div class="empty">Memuat poster...</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script>
const RUBRIK = [
  ['Kesesuaian tema', 'Poster sesuai tema: belajar dari pahlawan.'],
  ['Ketepatan informasi', 'Foto, deskripsi, biografi, peran, sumbangsih benar.'],
  ['Kreativitas, desain dan tata letak', 'Visual menarik, komposisi seimbang, mudah dibaca.'],
  ['Kerapian', 'Bersih, rapi, pigura dan hasil cetak baik.']
];
let scores = [0,0,0,0], curPoster = null, currentRole = 'siswa';
let listGuru = []; // Menyimpan daftar nama guru

function draw() {
  const total = scores.reduce((a,b)=>a+b,0);
  const nilai = (total/20*100).toFixed(0);
  document.getElementById('crits').innerHTML = RUBRIK.map((r,i) => `
    <div class="crit-block">
      <p class="crit-title">${i+1}. ${r[0]}</p>
      <p class="crit-desc">${r[1]}</p>
      <div class="score-group">
        ${[1,2,3,4,5].map(n => `<button class="score-btn ${scores[i]===n?'on':''}" onclick="setScore(${i},${n})">${n}</button>`).join('')}
      </div>
    </div>`).join('');
  document.getElementById('total').textContent = total;
  document.getElementById('nilai').textContent = nilai;
}
window.setScore = (i, n) => { scores[i] = n; draw(); };

window.setRole = async (role) => {
  if (role === 'guru') {
    const pw = prompt("Masukkan Password Khusus Guru:");
    if (pw === null) return; // Batal

    const btn = document.getElementById('btn-role-guru');
    const originalText = btn.textContent;
    btn.textContent = 'Mengecek...';
    btn.disabled = true;

    const { data, error } = await sb.rpc('check_guru_password', { input_pw: pw });

    btn.textContent = originalText;
    btn.disabled = false;

    if (error || !data) {
      toast('Password salah! Akses ditolak.', 'error');
      return;
    }
  }

  currentRole = role;
  document.getElementById('btn-role-guru').classList.toggle('on', role === 'guru');
  document.getElementById('btn-role-siswa').classList.toggle('on', role === 'siswa');
  
  // Tampilkan form yang sesuai
  if(role === 'guru') {
    document.getElementById('form-siswa').style.display = 'none';
    document.getElementById('form-guru').style.display = 'block';
  } else {
    document.getElementById('form-siswa').style.display = 'block';
    document.getElementById('form-guru').style.display = 'none';
  }
};

window.simpanNilai = async () => {
  let namaInput = '';
  let kelasInput = '';

  if (currentRole === 'siswa') {
    namaInput = document.getElementById('nama').value.trim().replace(/\s+/g, ' ');
    kelasInput = document.getElementById('kelas').value;
    if (!namaInput || !kelasInput || kelasInput === "") { toast('Isi nama dan pilih kelas dulu ya.', 'error'); return; }
  } else {
    namaInput = document.getElementById('guru-nama').value;
    if (!namaInput) { toast('Pilih nama kamu dari daftar.', 'error'); return; }
  }
  
  if (scores.includes(0)) { toast('Semua aspek harus dinilai (1–5).', 'error'); return; }
  
  const btn = document.querySelector('button[onclick="simpanNilai()"]');
  btn.disabled = true; btn.textContent = 'Mengecek data...';

  // Cegah menilai poster sendiri (khusus siswa)
  if (currentRole === 'siswa') {
    const pembuatNama = (curPoster.participants?.nama || '').trim().toLowerCase();
    const pembuatKelas = (curPoster.participants?.kelas || '').trim().toLowerCase();
    if (namaInput.toLowerCase() === pembuatNama && kelasInput.toLowerCase() === pembuatKelas) {
      toast('Kamu tidak bisa menilai postermu sendiri!', 'error'); 
      btn.disabled = false; btn.textContent = 'Kirim Penilaian'; return;
    }
  }

  // Cek Database (Cegah spam)
  let query = sb.from('assessments')
    .select('id')
    .eq('poster_id', curPoster.id)
    .ilike('reviewer_name', namaInput)
    .eq('reviewer_type', currentRole);
    
  if (currentRole === 'siswa') query = query.ilike('reviewer_kelas', kelasInput);
  
  const { data: existing } = await query.maybeSingle();
  if (existing) {
    toast('Nama ini sudah pernah menilai poster ini!', 'error');
    btn.disabled = false; btn.textContent = 'Kirim Penilaian'; return;
  }

  btn.textContent = 'Menyimpan...';
  const payload = {
    poster_id: curPoster.id,
    judge_id: null,
    reviewer_type: currentRole,
    reviewer_name: namaInput,
    reviewer_kelas: currentRole === 'siswa' ? kelasInput : null,
    s1: scores[0], s2: scores[1], s3: scores[2], s4: scores[3],
    kritik_saran: document.getElementById('kritik').value.trim() || null
  };
  
  const { error } = await sb.from('assessments').insert(payload);
  
  if (error) { 
    toast('Gagal menyimpan. Pastikan kamu belum pernah menilai poster ini.', 'error'); 
    btn.disabled = false; btn.textContent = 'Kirim Penilaian';
    return; 
  }
  
  toast('Terima kasih! Penilaianmu tersimpan.', 'success');
  setTimeout(() => location.href = 'detail.html?kode=' + encodeURIComponent(curPoster.kode), 1000);
};

(async () => {
  // Ambil daftar guru dari database
  const { data: teachers } = await sb.from('teachers').select('nama').order('nama');
  if(teachers) listGuru = teachers;

  const kode = new URLSearchParams(location.search).get('kode');
  if (!kode) { document.getElementById('content').innerHTML = '<div class="empty">Kode poster tidak ada.</div>'; return; }
  const { data: p, error } = await sb.from('posters').select('*, participants(nama,kelas)').eq('kode', kode).single();
  if (error || !p) { document.getElementById('content').innerHTML = '<div class="empty">Poster tidak ditemukan.</div>'; return; }
  curPoster = p;

  document.getElementById('content').innerHTML = `
    <a href="detail.html?kode=${encodeURIComponent(p.kode)}" class="btn btn-ghost btn-sm mb-2">← Kembali ke poster</a>
    <div class="card mb-2">
      <span class="badge badge-accent">${esc(p.kode)}</span>
      <h2 style="margin:8px 0 4px">${esc(p.judul)}</h2>
      <p class="text-muted">${esc(p.participants?.nama||'')} · ${esc(p.participants?.kelas||'')}</p>
      <img src="${esc(p.image_url||'')}" style="border-radius:var(--radius);margin-top:12px;width:100%">
    </div>
    
    <div class="card">
      <h3 style="margin-top:0; text-align:center;">Beri Penilaian</h3>
      <p class="text-muted" style="font-size:0.85rem; text-align:center; margin-bottom:15px;">Pilih identitas kamu untuk melanjutkan</p>
      
      <div class="role-tabs">
        <button id="btn-role-siswa" class="on" onclick="setRole('siswa')">🎓 Siswa</button>
        <button id="btn-role-guru" onclick="setRole('guru')">👨‍🏫 Guru / Penilai</button>
      </div>

      <!-- FORM UNTUK SISWA -->
      <div id="form-siswa">
        <div class="flex gap-2" style="flex-wrap:wrap">
          <div style="flex:1;min-width:150px">
            <label>Nama Lengkap</label>
            <input id="nama" placeholder="Ketik nama asli...">
          </div>
          <div style="flex:1;min-width:150px">
            <label>Kelas</label>
            <select id="kelas">
              <option value="" disabled selected>-- Pilih --</option>
              ${[
                'X RPL 1','X RPL 2','X RPL 3', 'XI RPL 1','XI RPL 2','XI RPL 3', 'XII RPL 1','XII RPL 2','XII RPL 3',
                'X APHP 1','X APHP 2', 'XI APHP 1','XI APHP 2', 'XII APHP 1','XII APHP 2',
                'X LPS 1','X LPS 2', 'XI LPS 1','XI LPS 2', 'XII LPS 1','XII LPS 2',
                'X DKV 1','X DKV 2', 'XI DKV 1','XI DKV 2', 'XII DKV 1','XII DKV 2',
                'X KULINER 1','X KULINER 2','X KULINER 3', 
                'XI KULINER 1','XI KULINER 2','XI KULINER 3', 
                'XII KULINER 1','XII KULINER 2','XII KULINER 3'
              ].map(k => `<option value="${k}">${k}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <!-- FORM UNTUK GURU -->
      <div id="form-guru" style="display:none;">
        <label>Pilih Nama Kamu</label>
        <select id="guru-nama">
          <option value="" disabled selected>-- Pilih Nama Guru --</option>
          ${listGuru.map(g => `<option value="${g.nama}">${g.nama}</option>`).join('')}
        </select>
      </div>

      <div id="crits" class="mt-2"></div>
      <label>Kritik & saran (opsional)</label>
      <textarea id="kritik" placeholder="Tambahkan catatan..."></textarea>
      
      <div class="total-display">
        <div><div class="sub">Skor</div><div class="big"><span id="total">0</span><span class="sub">/20</span></div></div>
        <div style="margin-left:auto;text-align:right"><div class="sub">Nilai</div><div class="big" style="color:var(--primary)"><span id="nilai">0</span></div></div>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="simpanNilai()">Kirim Penilaian</button>
    </div>`;
  draw();
})();
</script>
</body>
</html>
