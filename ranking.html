<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking — PAMERIN</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-root="">
<div id="header"></div>
<main class="main">
<div class="container">
  <h1>Ranking Karya</h1>
  <p class="text-muted">Peringkat berdasarkan Nilai Akhir (60% Total Nilai Guru + 40% Total Nilai Siswa).</p>
  
  <!-- KOLOM PENCARIAN -->
  <div class="card mb-3" style="padding: 12px;">
    <input type="text" id="searchInput" placeholder="🔍 Cari nama siswa, kelas, atau judul poster..." style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 0.95rem;">
  </div>

  <div id="content"><div class="empty">Memuat...</div></div>
  
  <!-- MODAL ULASAN -->
  <div id="modalUlasan" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="flex-between mb-2">
        <h3 id="modalTitle" style="margin:0">Ulasan</h3>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modalUlasan').classList.add('hidden')">✕ Tutup</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script>
let allAssessments = [];
let allRankingData = [];

// Fungsi buka modal ulasan
window.bukaDetail = (posterId, judul) => {
  document.getElementById('modalTitle').textContent = 'Ulasan: ' + judul;
  // Pastikan tipe datanya sama (string vs angka) pakai String()
  const list = allAssessments.filter(a => String(a.poster_id) === String(posterId));
  
  if (!list.length) {
    document.getElementById('modalBody').innerHTML = '<div class="empty">Belum ada ulasan untuk poster ini.</div>';
  } else {
    list.sort((a,b) => (a.reviewer_type === 'guru' ? -1 : 1));
    
    document.getElementById('modalBody').innerHTML = list.map(a => {
      const nama = a.judge_id ? (a.profiles?.full_name || 'Guru') : a.reviewer_name;
      const kelas = a.reviewer_type === 'siswa' ? ` (${a.reviewer_kelas})` : '';
      const badgeColor = a.reviewer_type === 'guru' ? 'background:var(--primary);color:white' : 'background:var(--border);color:var(--text)';
      
      return `
      <div class="review-card">
        <div class="flex-between mb-1">
          <b>${esc(nama)}${esc(kelas)}</b>
          <span class="badge" style="${badgeColor}">${a.reviewer_type.toUpperCase()}</span>
        </div>
        <div style="font-size:.85rem; color:var(--text-muted);">
          Memberikan Nilai: <b style="color:var(--text); font-size:1rem;">${Number(a.nilai).toFixed(0)}</b> / 100
        </div>
        <p>"${esc(a.kritik_saran || 'Tidak meninggalkan pesan.')}"</p>
      </div>`;
    }).join('');
  }
  document.getElementById('modalUlasan').classList.remove('hidden');
};

function renderTable(data) {
  const content = document.getElementById('content');
  
  if (!data.length) { 
    content.innerHTML = '<div class="empty">Tidak ada data yang cocok dengan pencarian.</div>'; 
    return; 
  }
  
  // PERBAIKAN: Tombol ulasan pakai data-id dan data-judul
  content.innerHTML = `
    <div class="table-scroll"><table class="rank-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Kode</th>
          <th>Judul</th>
          <th>Pembuat</th>
          <th>Kelas</th>
          <th>Total Nilai Guru</th>
          <th>Total Nilai Siswa</th>
          <th>Nilai Akhir (60/40)</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>${data.map((r) => `
        <tr class="${r.originalRank === 1 ? 'top-1' : ''}">
          <td class="rank-num">${r.originalRank}</td>
          <td><a href="detail.html?kode=${encodeURIComponent(r.kode)}">${esc(r.kode)}</a></td>
          <td><b>${esc(r.judul)}</b></td>
          <td>${esc(r.participants?.nama||'—')}</td>
          <td>${esc(r.participants?.kelas||'')}</td>
          
          <td>
            <b style="color:var(--primary);font-size:1.1rem">${r.totalGuru}</b><br>
            <small class="text-muted">dari ${r.countGuru} guru</small>
          </td>
          
          <td>
            <b style="color:var(--accent);font-size:1.1rem">${r.totalSiswa}</b><br>
            <small class="text-muted">dari ${r.countSiswa} siswa</small>
          </td>
          
          <td>
            <b style="color:#10b981; font-size:1.2rem; border-bottom: 2px solid #10b981; padding-bottom: 2px;">
              ${r.nilaiAkhir.toFixed(1)}
            </b>
          </td>
          
          <!-- TOMBOL BARU YANG ANTI ERROR -->
          <td>
            <button class="btn btn-outline btn-sm btn-ulasan" data-id="${r.id}" data-judul="${esc(r.judul)}">
              💬 Ulasan
            </button>
          </td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}

(async () => {
  const { data: settings } = await sb.from('event_settings').select('ranking_published').eq('id',1).single();
  if (!settings?.ranking_published) {
    document.getElementById('content').innerHTML = '<div class="alert alert-info">Ranking belum dipublikasikan oleh panitia. Cek lagi nanti setelah penilaian selesai.</div>';
    return;
  }

  const { data: posters } = await sb.from('posters').select('id,kode,judul,image_url,participants(nama,kelas)').eq('status','published');
  
  const { data: assessments } = await sb.from('assessments').select(`
    poster_id, nilai, reviewer_type, reviewer_name, reviewer_kelas, kritik_saran,
    profiles:judge_id(full_name)
  `);
  
  allAssessments = assessments || [];

  const map = {};
  allAssessments.forEach(a => { 
    if(!map[a.poster_id]) map[a.poster_id] = {guru:[], siswa:[]};
    if(a.reviewer_type === 'guru') map[a.poster_id].guru.push(Number(a.nilai));
    else map[a.poster_id].siswa.push(Number(a.nilai));
  });

  const rows = (posters||[]).map(p => {
    const g = map[p.id]?.guru || [];
    const s = map[p.id]?.siswa || [];
    
    const totalGuru = g.reduce((a,b)=>a+b,0);
    const totalSiswa = s.reduce((a,b)=>a+b,0);
    
    // RUMUS 60% GURU + 40% SISWA
    const nilaiAkhir = (totalGuru * 0.6) + (totalSiswa * 0.4);

    return {
      ...p, 
      countGuru: g.length, 
      countSiswa: s.length,
      totalGuru, 
      totalSiswa, 
      nilaiAkhir
    };
  }).filter(r => r.countGuru > 0 || r.countSiswa > 0)
    .sort((a, b) => {
      if (a.countGuru === 0 && b.countGuru > 0) return 1;
      if (b.countGuru === 0 && a.countGuru > 0) return -1;
      if (b.nilaiAkhir !== a.nilaiAkhir) return b.nilaiAkhir - a.nilaiAkhir;
      if (b.totalGuru !== a.totalGuru) return b.totalGuru - a.totalGuru;
      return b.countGuru - a.countGuru;
    });

  if (!rows.length) { document.getElementById('content').innerHTML = '<div class="empty">Belum ada penilaian.</div>'; return; }
  
  allRankingData = rows.map((r, index) => ({ ...r, originalRank: index + 1 }));
  
  renderTable(allRankingData);

  // Logika Pencarian
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = allRankingData.filter(r => {
      const nama = (r.participants?.nama || '').toLowerCase();
      const kelas = (r.participants?.kelas || '').toLowerCase();
      const judul = (r.judul || '').toLowerCase();
      const kode = (r.kode || '').toLowerCase();
      return nama.includes(query) || kelas.includes(query) || judul.includes(query) || kode.includes(query);
    });
    renderTable(filtered);
  });

  // EVENT LISTENER UNTUK TOMBOL ULASAN (DITARUH DI LUAR RENDER)
  document.getElementById('content').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-ulasan');
    if (btn) {
      const id = btn.getAttribute('data-id');
      const judul = btn.getAttribute('data-judul');
      bukaDetail(id, judul);
    }
  });

})();
</script>
</body>
</html>
