<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detail Poster — PAMERIN</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-root="">
<div id="header"></div>
<main class="main">
<div class="container-narrow" id="content">
  <div class="card"><div class="skeleton" style="height:300px"></div></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  const kode = new URLSearchParams(location.search).get('kode');
  if (!kode) { document.getElementById('content').innerHTML = '<div class="empty">Kode poster tidak ditemukan di URL.</div>'; return; }
  const { data, error } = await sb.from('posters')
    .select('*, participants(nama,kelas)')
    .eq('kode', kode).single();
  if (error || !data) { document.getElementById('content').innerHTML = '<div class="empty">Poster tidak ditemukan.</div>'; return; }
  document.title = data.judul + ' — PAMERIN';

  // QR to self
  let qrSvg = '';
  try {
    const url = location.origin + location.pathname + '?kode=' + encodeURIComponent(kode);
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    qrSvg = q.createSvgTag(4);
  } catch(e) {}

  document.getElementById('content').innerHTML = `
    <a href="gallery.html" class="btn btn-ghost btn-sm mb-2">← Kembali ke galeri</a>
    <div class="card">
      <span class="badge badge-accent">${esc(data.kode)}</span>
      <h1 style="margin-top:12px">${esc(data.judul)}</h1>
      <p class="text-muted">${esc(data.participants?.nama || '—')} · ${esc(data.participants?.kelas || '')}</p>
      <img src="${esc(data.image_url || '')}" alt="${esc(data.judul)}" style="border-radius:var(--radius);margin-top:12px;width:100%">
      ${data.deskripsi ? `<h3 class="mt-3">Deskripsi</h3><p>${esc(data.deskripsi)}</p>` : ''}
      ${data.tujuan ? `<h3>Tujuan</h3><p>${esc(data.tujuan)}</p>` : ''}
      ${data.informasi ? `<h3>Informasi</h3><p>${esc(data.informasi)}</p>` : ''}
      ${data.sumber ? `<h3>Sumber Referensi</h3><p>${esc(data.sumber)}</p>` : ''}
      <div class="mt-3" style="border-top:1px solid var(--border);padding-top:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div style="background:#fff;padding:8px;border-radius:6px">${qrSvg}</div>
        <div>
          <small class="text-muted">QR Code poster ini</small><br>
          <b>${esc(data.kode)}</b>
        </div>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
